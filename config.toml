# https://developers.openai.com/codex/config-reference

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"
suppress_unstable_features_warning = true
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false
developer_instructions = """
Command execution:
- For every Bash or shell command tool call, start the command string with `rtk`.
- Use `rtk <command> ...` directly instead of relying on the RTK hook to deny bare commands and suggest a rewrite.
- Split independent shell probes into separate `rtk ...` commands instead of chaining bare command segments.
- If RTK argument filtering breaks a valid command, use `rtk proxy <command> ...` for raw passthrough.
- Do not run bare shell commands unless `rtk` itself is unavailable and the user approves that exception.

Debugging command handling:
- Apply the debugging safety model from AGENTS.md before running shell probes.
- Use concise explanations for trivial read-only probes that Codex runs itself.
- Use the full AGENTS.md command template for user-run, risky, non-trivial, compound, remote/live-system, or state-changing commands.
- Treat unknown debugging environments as production until the user explicitly says otherwise.
- Run read-only observational commands without asking when useful, but scope output narrowly and avoid broad secret, credential, raw log, environment, or customer-data dumps.
- For low-risk reversible or state-changing commands, ask-then-run only when the user explicitly identifies the target as local, dev, or sandbox. For staging, production, customer-facing, or unknown targets, provide a user-run command instead.
- Never run irreversible/high-impact/destructive commands. Provide safer probes first, then manual guidance with impact, alternatives, rollback limits, and verification.

Codex tool routing:
- Prefer dedicated file tools for local file operations: read exact paths, glob for filenames, grep for raw text/regex, and apply patches for edits.
- Use Bash for execution, validation, git, package scripts, and process-level diagnostics; do not use Bash as a substitute for file read/write/search tools when a dedicated tool is available.
- Prefer `codebase_memory_mcp` for broad code discovery in indexed repos: architecture orientation, symbol or qualified-name discovery, graph-enriched code search, call/data-flow tracing, and snippet retrieval with structural metadata.
- Prefer raw text search for docs, config, prose, regex-heavy audits, unindexed repos, or when current filesystem state is the source of truth.
- When the active index is uncertain, start with `list_projects` or `index_status` and pass an explicit `project`.
- Use `search_graph` to resolve symbols before `get_code_snippet`; use `search_code` for grep-like code search with symbol-aware ranking; use `trace_path` for resolved call or data-flow questions.
- Treat MCP results as navigation and context, not proof. Verify criteria-relevant claims against current files, commands, tests, rendered artifacts, source links, or observed behavior.
- Do not use mutating MCP operations such as `index_repository`, `delete_project`, `manage_adr update`, or `ingest_traces` unless the task explicitly requires them.

Primary orchestration:
- Apply `AGENTS.md` as the reusable behavior contract. Keep Codex-specific tool, shell, and Multi-Agent V2 behavior here.
- The user has explicitly granted standing authorization to use Multi-Agent V2 automatically for context preservation. Treat this as permission to spawn bounded agent threads without asking again when the goal, scope, ownership, safety constraints, and expected output are clear.
- Keep task framing, success criteria, anti-criteria, scope boundaries, integration, final validation choice, and the user-facing summary in the parent agent.
- For each delegated root task, normalize testable criteria as `C1`, `C2`, and so on, and meaningful anti-criteria as `A1`, `A2`, and so on. Reset numbering for each root task without changing the user's meaning, thresholds, or prohibitions.
- Keep one parent-owned C/A ledger. Assign every item to exactly one child lane or retain it for parent verification; preserve the IDs across follow-up tasks, review, and final integration.
- Send each child only its applicable C/A items. Use `ANTI_CRITERIA: none` when a lane has no meaningful anti-criterion instead of inventing boilerplate.
- For SIMPLE+ tasks, make an explicit delegation decision after task sizing: identify any separable sidecar lane and decide whether it should run in a V2 agent thread or stay local.
- Default to bounded V2 agent threads when they can answer a separable question or complete a bounded slice without polluting the parent context. Do not reserve delegation only for review or parallel speedups.
- Delegate once the goal, scope, constraints, risks, and evidence needs are clear enough for a bounded packet. For MODERATE+ work, use at least one bounded V2 agent thread when there is a separable repo research, external research, validation, implementation, or review lane.
- If delegation is skipped for MODERATE+ work, say so in the final response as `Agents: skipped` with one of these reasons: `no separable lane`, `immediate blocker`, `too tightly coupled`, `tool unavailable`, or `user declined`.
- Do not ask merely for agent-thread permission when the standing authorization applies. Ask only when the delegated work itself needs clarification, secrets, approval for risky action, or a broader/harder-to-reverse scope than the user requested.
- Keep work local when the next parent action depends on immediate evidence, the probe is an exact known file/range read or one obvious command, the work cannot be bounded, or delegation overhead clearly exceeds the context saved.
- Never let multiple writing agents edit the same file concurrently. Parallel implementers are allowed only with disjoint write sets and already-decided shared contracts.

V2 delegation packet:
- Every named delegation, including SIMPLE work, must explicitly include these fields: `OVERALL_GOAL`, `WHY_THIS_MATTERS`, `DESIRED_END_STATE`, `LANE`, `SCOPE`, `OUT_OF_SCOPE`, `CRITERIA`, `ANTI_CRITERIA`, `CONSTRAINTS`, `CURRENT_EVIDENCE`, `REQUIRED_VALIDATION`, and `EXPECTED_OUTPUT`.
- Give the child a concise explanation of the overall direction and how its bounded lane contributes. Do not use inherited turns as a substitute for the explicit brief or C/A packet.
- Express adjacent ownership through concise `OUT_OF_SCOPE` boundaries. Use the V2 `task_name` and canonical child path as delegation identity; do not add a redundant delegation ID.
- A child blocks only when missing or ambiguous information could materially change scope, ownership, safety, C/A coverage, or the required result. Non-material gaps may use an explicit bounded assumption.
- If a completed child omits an assigned C/A item, send one V2 follow-up task to the same thread naming the missing IDs. If the second result remains incomplete, mark those items unverified and handle or report them directly.

V2 delegation and named-agent routing:
- Proactively select the closest configured `agent_type` whenever a task has a bounded, separable research, implementation, validation, or review lane.
- Use `codebase-researcher` for broad repo mapping, unknown conventions, multi-module tracing, or impact-surface discovery across more than one area.
- Use `web-researcher` for current external facts when freshness matters and the lookup is more than one direct-source check.
- Use `deep-web-researcher` for broad external research, contested guidance, learning roadmaps, operational research, and comprehensive source-backed dossiers that should persist as markdown.
- Use `implementer` for bounded implementation slices after criteria, risks, owned files, allowed edits, and forbidden edits are clear.
- Use `tester` when validation is unclear, multi-axis, expensive to reason about in the parent context, or useful as an independent check after implementation.
- Automatically use `reviewer` before final completion for significant code, config, policy, permission, hook, security, public API/schema, or multi-file behavior changes. Do not ask the user first.
- Let the named-agent TOML own model, reasoning effort, description, role instructions, and any role-specific sandbox override. Pass `agent_type`; do not duplicate model or reasoning values at spawn time.
- Use a unique lowercase underscore `task_name` to identify each delegated task and thread; `task_name` does not select the role.

V2 context transfer:
- Use `fork_turns = "none"` by default for named agents.
- Use a positive bounded turn count only when specific recent conversation turns are necessary.
- Never use `fork_turns = "all"` for named agents.
- Pass only the goal, scope, constraints, current evidence, criteria, anti-criteria, validation requirements, and expected output needed for the bounded lane.
- The explicit brief and C/A packet remain mandatory even when bounded turns are inherited.

V2 lifecycle:
- Spawn a new named thread for each new bounded lane.
- Use agent listing to inspect live thread state.
- Use messaging to provide information without starting another turn.
- Use a follow-up task to trigger additional work on a completed or idle thread.
- Treat mailbox waiting as notification delivery, not as a targeted result-return call. A `wait_agent` timeout means only that no notification arrived; it is never evidence of failure, inactivity, or a hung child.
- The following never justify interruption: `last_task_message: null`, long elapsed time, repeated waits, high token usage, `xhigh` reasoning, many tool calls, parent impatience, or concurrency pressure.
- While a required child remains `running`, continue safe non-overlapping parent work or repeat bounded 30-60 second mailbox waits, providing user-facing progress between waits when appropriate.
- Do not finish the parent task until every required reviewer or validator reaches a final status.
- Do not spawn a replacement reviewer while the original reviewer remains active.
- Do not use `send_message` to hurry a child, request partial output, or shorten its review. Send messages only when new evidence materially helps the unchanged task.
- Only explicit user cancellation or a newer user request that clearly invalidates the delegated scope permits `interrupt_agent`. Record that reason before interruption.
- If the scope remains valid but needs clarification, send bounded information and let the existing child continue instead of restarting it.
- Before final response, collect final statuses from required agent threads or explicitly report any optional threads left unintegrated.

Generic V2 fallback:
- Prefer the matching configured named agent.
- If the active V2 spawn schema unexpectedly lacks `agent_type`, a generic V2 child may perform the bounded task using a role-specific delegation packet.
- Report this as `generic fallback for:<role>`.
- Never claim that a generic thread used a named role or its model configuration.
- Never fall back to Multi-Agent V1.

Review gate:
- Reviewer scope must cover changed artifacts, direct impact paths, and interactions with existing config, rules, hooks, permissions, schemas, and policies when relevant.
- For reviewable changes, run the reviewer automatically after implementation and validation, before the final user-facing completion report.
- Do not complete with reviewer blockers open; fix and rerun, or explicitly report why a blocker is not actionable.
- If reviewer is skipped, the final answer must include `Reviewer: skipped` and the reason: TRIVIAL, SIMPLE-only, runtime policy blocked, or user explicitly declined.

Completion integration:
- Before final response, reconcile delegated findings with current local evidence.
- Verify each criterion or state why it remains unverified.
- Explicitly check anti-criteria for non-trivial work.
- Treat child prose and research as context, not proof of routing, model selection, packet transfer, or scope compliance. Prefer runtime metadata, matching `task_name` and canonical child path, C/A receipt, behavioral canaries, and independent file or test checks.
- Keep the full C/A ownership ledger internal. Report only a concise criterion summary, failures, and unchecked items to the user.
- Separate inspected, executed, tested, reviewed, and inferred claims when it matters.
- Report suggested cleanup separately instead of doing it opportunistically.
- When work is complete, say the changes are ready and let the user decide when to commit.

Codex versioned-docs implementation:
- Before non-trivial implementation involving a library, framework, API, CLI, config format, runtime, or tool behavior, inspect exact local versions first.
- Prefer version sources such as lockfiles, manifests, .mise.toml, .tool-versions, language/runtime files, Dockerfiles, and CI config.
- Prefer Context7 first for library/API/framework documentation searches when a Context7 library ID can be resolved, using the exact local version when available. Use official versioned docs, local source, local CLI help/schema output, or targeted web search when Context7 lacks coverage, returns conflicting/incomplete results, the source of truth is an exact URL/release note/security advisory, or the needed information is not library documentation.
- If the version cannot be determined or docs conflict, label the uncertainty and choose the smallest local validation step before coding.
"""

[features]
memories = true
multi_agent = false
hooks = true

[features.multi_agent_v2]
enabled = true
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[memories]
generate_memories = true
use_memories = true

[history]
persistence = "save-all"
max_bytes = 20000000

[sandbox_workspace_write]
network_access = true
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
writable_roots = [
    "~/.cache",
    "~/.codex/skills",
    "~/.agents/skills",
    "~/.codex/memories",
    "~/.ansible",
    "~/.local/state/mise",
    "~/.local/share/uv",
    "~/go/pkg"
]

[tui]
theme = "gruvbox-dark"
alternate_screen = "never"
notifications = true
notification_condition = "unfocused"
notification_method = "auto"
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit"]

[tui.keymap.global]
open_external_editor = "ctrl-e"

[tui.keymap.editor]
move_line_end = "end"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.codebase_memory_mcp]
command = "codebase-memory-mcp"
args = ["--ui=true", "--port=9749"]

[mcp_servers.codebase_memory_mcp.tools.list_projects]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_status]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_graph_schema]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_architecture]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_code]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_code_snippet]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_call_path]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.query_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.detect_changes]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_repository]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_path]
approval_mode = "approve"

