# https://developers.openai.com/codex/config-reference

model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_verbosity = "low"
suppress_unstable_features_warning = true
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false
developer_instructions = """
Command execution:
- For every Bash or shell command tool call, start the command string with `rtk`.
- Use `rtk <command> ...` directly instead of relying on the RTK hook to deny bare commands and suggest a rewrite.
- Split independent shell probes into separate `rtk ...` commands instead of chaining bare command segments.
- If RTK argument filtering breaks a valid command, use `rtk proxy <command> ...` for raw passthrough.
- Do not run bare shell commands unless `rtk` itself is unavailable and the user approves that exception.

Debugging command handling:
- Apply the debugging safety model from AGENTS.md before running shell probes.
- Use concise explanations for trivial read-only probes that Codex runs itself.
- Use the AGENTS.md command disclosure checklist for user-run, risky, non-trivial, compound, remote/live-system, or state-changing commands.
- Treat unknown debugging environments as production until the user explicitly says otherwise.
- Run read-only observational commands without asking when useful, but scope output narrowly and avoid broad secret, credential, raw log, environment, or customer-data dumps.
- For low-risk reversible or state-changing commands, ask-then-run only when the user explicitly identifies the target as local, dev, or sandbox. For staging, production, customer-facing, or unknown targets, provide a user-run command instead.
- Never run irreversible/high-impact/destructive commands. Provide safer probes first, then manual guidance with impact, alternatives, rollback limits, and verification.

Codex tool routing:
- Prefer dedicated file tools for local file operations: read exact paths, glob for filenames, grep for raw text/regex, and apply patches for edits.
- Use Bash for execution, validation, git, package scripts, and process-level diagnostics; do not use Bash as a substitute for file read/write/search tools when a dedicated tool is available.
- Prefer `codebase_memory_mcp` for broad code discovery in indexed repos: architecture orientation, symbol or qualified-name discovery, graph-enriched code search, call/data-flow tracing, and snippet retrieval with structural metadata.
- Prefer raw text search for docs, config, prose, regex-heavy audits, unindexed repos, or when current filesystem state is the source of truth.
- When the active index is uncertain, start with `list_projects` or `index_status` and pass an explicit `project`.
- Use `search_graph` to resolve symbols before `get_code_snippet`; use `search_code` for grep-like code search with symbol-aware ranking; use `trace_path` for resolved call or data-flow questions.
- Treat MCP results as navigation and context, not proof. Verify criteria-relevant claims against current files, commands, tests, rendered artifacts, source links, or observed behavior.
- Do not use mutating MCP operations such as `index_repository`, `delete_project`, `manage_adr update`, or `ingest_traces` unless the task explicitly requires them.

Model routing and primary ownership:
- Apply `AGENTS.md` for safety, criteria, review thresholds, verification, and completion. The orchestration rules below apply to the primary; spawned workers execute their assignment and do not delegate.
- Keep goals, the overall approach, shared decisions, the full C/A ledger, integration, and final verification in the primary conversation. Delegate substantive research and execution once the brief is clear; keep tiny immediate checks local.
- Choose a model profile and give it a task-specific role. Use `luna` for bounded lookups, straightforward exploration, mechanical edits, and focused checks with inexpensive verification. Use `sol` for substantial implementation, diagnosis, complex research, and test development. Reserve `reviewer` for independent review required by `AGENTS.md` or explicitly requested.
- Select `agent_type` by profile name; use a unique lowercase underscore `task_name` for the assignment. Use the named `sol` and `luna` profiles for ordinary delegated work; they pin their models and high effort. The `reviewer` inherits the active main model and sets high effort. Do not override model or effort in spawn arguments. Unnamed subagents also inherit the main model; they are not the routine execution route.
- State the concrete benefit of delegation briefly. Optimize total work, including context transfer, retries, integration, and review; do not delegate tiny tasks to meet a quota or claim unmeasured cost, token, or speed savings.

Briefs and context:
- Give a free-form brief with the overall purpose, desired result, relevant C/A IDs, in/out boundaries, established evidence and entrypoints, required validation, and expected return. No fixed headings or receipt envelope are required.
- For writing assignments, name owned paths and allowed edits, warn that other workers may be active, and require preservation of others' changes. Research-only assignments must explicitly prohibit modifications through any tool. General workers inherit parent permissions; prose scope is not an enforced read-only sandbox.
- Resolve material gaps in authority, scope, ownership, safety, or acceptance before dispatch. Workers may state bounded assumptions for non-material gaps; they must surface blockers and useful partial findings.
- Set `fork_turns="none"` by default. Use only `"1"`, `"2"`, or `"3"` when the brief cannot safely supply necessary recent context; never use full-history forks for these profiles. Pass focused evidence, not raw conversation dumps.
- Workers return the result first, with changed paths or source references, checks actually run and their results, unresolved C/A, and uncertainty. Keep durable task-state memory with the primary and follow the existing explicit-authorization rule for memory writes.

Coordination and recovery:
- Only the primary spawns agents. Parallel writers need disjoint owned files and settled shared contracts. Sequence dependent work; do not repeat a worker's investigation while it owns that question.
- Reuse a thread for continuation when its context remains useful. Use messages for new relevant information and follow-up tasks to restart an idle or completed worker.
- Allow one targeted routing recovery per failed assignment: correct the brief and resume, or choose a better-suited worker. Diagnose context, tooling/access, and reasoning separately; transfer useful findings when switching. Do not run an automatic model ladder. If recovery fails, report the blocker and smallest next decision.
- Ordinary implementation fix/test cycles and required review/re-review follow `AGENTS.md`; they are not routing retries. The primary handles unresolved architectural decisions locally.
- A mailbox timeout is only a lack of notification. While a required worker is running, continue non-overlapping work or wait in bounded 30-60 second intervals. Do not interrupt, replace, or hurry it because of elapsed time, silence, token usage, effort, or concurrency pressure.
- Interrupt only for explicit user cancellation or a newer request that invalidates the assignment; record the reason. Do not finish until required workers and reviewers have final statuses.

Independent review:
- Before editing work that requires review, record a task-start baseline and pre-existing edits for the scoped files. Include new files and task changes across staged and unstaged content; do not rely on a committed-only diff to represent uncommitted work.
- After local validation, spawn one fresh `reviewer` with the original goal, exact C/A, baseline, changed artifacts, direct impact paths, known risks, and validation evidence. It reviews Spec and Standards directly, without loading the `review` skill or spawning other agents.
- Verify the reviewer's effective read-only permissions. Live parent permissions can override the profile default. If that happens, use a fresh `codex --sandbox read-only --model <active-main-model>` session to spawn the dedicated reviewer with the same brief and collect its decision. Carry over the originating conversation's actual active model, including any session override, rather than reverting to the configured default. Keep hooks enabled and global permissions unchanged; if an enforced read-only review cannot run, report blocked rather than waive the gate.
- Apply `AGENTS.md` blocker and re-review rules. Fix confirmed blockers and continue the same reviewer for targeted re-review; use a fresh full review only for materially changed scope or solution. Required review closes only on `Decision: PASS` or an explicit user waiver.
- An unavailable reviewer or exhausted routing recovery does not waive the gate. Never use the primary's own assessment as independent review. Keep the `review` skill for explicitly requested fixed-point branch/PR reviews.

Integration:
- Verify consequential worker claims and integration points against current files, outputs, tests, artifacts, or sources without repeating broad discovery. Child self-descriptions do not prove the selected profile, model, effort, or permissions; use runtime metadata when validating routing.
- Reconcile C/A and distinguish inspected, tested, reviewed, and inferred claims. Report changed files, validation, review status, and unknowns concisely; keep unrelated cleanup separate.
- When complete, say the changes are ready and let the user decide when to commit.

Codex versioned-docs implementation:
- Before non-trivial implementation involving a library, framework, API, CLI, config format, runtime, or tool behavior, inspect exact local versions first.
- Prefer version sources such as lockfiles, manifests, .mise.toml, .tool-versions, language/runtime files, Dockerfiles, and CI config.
- Prefer Context7 first for library/API/framework documentation searches when a Context7 library ID can be resolved, using the exact local version when available. Use official versioned docs, local source, local CLI help/schema output, or targeted web search when Context7 lacks coverage, returns conflicting/incomplete results, the source of truth is an exact URL/release note/security advisory, or the needed information is not library documentation.
- If the version cannot be determined or docs conflict, label the uncertainty and choose the smallest local validation step before coding.
"""

[agents]
default_subagent_reasoning_effort = "high"

[features]
apps = false
memories = true
multi_agent = true
hooks = true
plugins = true
remote_plugin = true

[features.multi_agent_v2]
enabled = true
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[memories]
generate_memories = true
use_memories = true

[history]
persistence = "save-all"
max_bytes = 20000000

[sandbox_workspace_write]
network_access = true
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
writable_roots = [
    "~/.cache",
    "~/.codex/skills",
    "~/.agents/skills",
    "~/.codex/memories",
    "~/.ansible",
    "~/.local/state/mise",
    "~/.local/share/uv",
    "~/go/pkg"
]

[tui]
theme = "gruvbox-dark"
alternate_screen = "never"
notifications = true
notification_condition = "unfocused"
notification_method = "auto"
status_line = ["model-with-reasoning", "context-used", "used-tokens", "weekly-limit", "current-dir", "git-branch", "branch-changes"]
screen_reader_detection_done = true

[tui.keymap.global]
open_external_editor = "ctrl-e"

[tui.keymap.editor]
move_line_end = "end"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.codebase_memory_mcp]
command = "codebase-memory-mcp"
args = ["--ui=true", "--port=9749"]
disabled_tools = [
    "query_graph",
    "index_repository",
    "delete_project",
    "detect_changes",
    "manage_adr",
    "ingest_traces",
]

[mcp_servers.codebase_memory_mcp.tools.list_projects]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_status]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_graph_schema]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_architecture]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_code]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_code_snippet]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_call_path]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.query_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.detect_changes]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_repository]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_path]
approval_mode = "approve"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/mgajewskik/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
