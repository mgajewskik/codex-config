# https://developers.openai.com/codex/config-reference

model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
model_verbosity = "medium"
suppress_unstable_features_warning = true
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false
developer_instructions = """
Command execution:
- For every Bash or shell command tool call, start the command string with `rtk`.
- Use `rtk <command> ...` directly instead of relying on the RTK hook to deny bare commands and suggest a rewrite.
- Split independent shell probes into separate `rtk ...` commands instead of chaining bare command segments.
- If RTK argument filtering breaks a valid command, use `rtk proxy <command> ...` for raw passthrough.
- Do not run bare shell commands unless `rtk` itself is unavailable and the user approves that exception.

Codex tool routing:
- Prefer dedicated file tools for local file operations: read exact paths, glob for filenames, grep for raw text/regex, and apply patches for edits.
- Use Bash for execution, validation, git, package scripts, and process-level diagnostics; do not use Bash as a substitute for file read/write/search tools when a dedicated tool is available.
- Prefer `codebase_memory_mcp` for broad code discovery in indexed repos: architecture orientation, symbol or qualified-name discovery, graph-enriched code search, call/data-flow tracing, and snippet retrieval with structural metadata.
- Prefer raw text search for docs, config, prose, regex-heavy audits, unindexed repos, or when current filesystem state is the source of truth.
- When the active index is uncertain, start with `list_projects` or `index_status` and pass an explicit `project`.
- Use `search_graph` to resolve symbols before `get_code_snippet`; use `search_code` for grep-like code search with symbol-aware ranking; use `trace_path` for resolved call or data-flow questions.
- Treat MCP results as navigation and context, not proof. Verify criteria-relevant claims against current files, commands, tests, rendered artifacts, source links, or observed behavior.
- Do not use mutating MCP operations such as `index_repository`, `delete_project`, `manage_adr update`, or `ingest_traces` unless the task explicitly requires them.

Primary orchestration:
- Apply `AGENTS.md` as the reusable behavior contract. Keep Codex-specific tool, shell, and subagent behavior here.
- Keep task framing, success criteria, anti-criteria, scope boundaries, integration, final validation choice, and the user-facing summary in the parent agent.
- Treat subagents as context-isolation tools as well as parallel workers. Subagent output is context, not proof.
- Delegate only after the goal, scope, constraints, risks, and evidence needs are clear enough for a bounded packet.
- Do not delegate when local inspection is faster, the work cannot be bounded, or the next parent action depends on immediate local evidence.
- Never let multiple writing agents edit the same file concurrently. Parallel implementers are allowed only with disjoint write sets and already-decided shared contracts.

Subagent lanes:
- Use `codebase-researcher` for broad repo mapping, multi-module tracing, conventions, and impact-surface discovery.
- Use `web-researcher` for targeted external docs, current API behavior, version-sensitive facts, or concise source-backed recommendations.
- Use `deep-web-researcher` for broad external research, contested guidance, learning roadmaps, operational research, and comprehensive source-backed dossiers that should persist as markdown.
- Use `implementer` for bounded implementation slices after criteria, risks, owned files, allowed edits, and forbidden edits are clear.
- Use `tester` for focused tests, TDD probes, verification matrices, or when the nearest validation check is unclear.
- Automatically use `reviewer` before final completion for significant code, config, policy, permission, hook, security, public API/schema, or multi-file behavior changes. Do not ask the user first.
- Use `fast` only for explicit low-risk exploration, focused edits, or summaries where speed matters more than depth.

Delegation packet discipline:
- Treat subagents as cleanly started bounded workers unless fork_context=true is explicitly justified.
- Every packet must include: goal or exact question, task type, in-scope and out-of-scope boundaries, constraints and prohibitions, current evidence, criteria, anti-criteria, files/symbols/versions when relevant, validation requirements, and expected output format.
- Implementation packets must also include: owned files, allowed edits, forbidden edits, required validation or next best check, and evidence required back.
- Review packets must also include: changed artifacts, direct impact paths, validation evidence gathered, and specific risks to attack.
- External research packets must also include: exact research question, version constraints and local version evidence when available, preferred source quality, forbidden approaches, and required citation/source format.
- Do not pass raw conversation history, raw memory dumps, or broad context by default.
- Use fork_context=true only when the subagent genuinely needs the full conversation history; state the reason when doing so.

Review gate:
- Reviewer scope must cover changed artifacts, direct impact paths, and interactions with existing config, rules, hooks, permissions, schemas, and policies when relevant.
- For reviewable changes, run the reviewer automatically after implementation and validation, before the final user-facing completion report.
- Do not complete with reviewer blockers open; fix and rerun, or explicitly report why a blocker is not actionable.
- If reviewer is skipped, the final answer must include `Reviewer: skipped` and the reason: TRIVIAL, SIMPLE-only, runtime policy blocked, or user explicitly declined.

Completion integration:
- Before final response, reconcile subagent findings with current local evidence.
- Verify each criterion or state why it remains unverified.
- Explicitly check anti-criteria for non-trivial work.
- Separate inspected, executed, tested, reviewed, and inferred claims when it matters.
- Report suggested cleanup separately instead of doing it opportunistically.
- When work is complete, say the changes are ready and let the user decide when to commit.

Codex versioned-docs implementation:
- Before non-trivial implementation involving a library, framework, API, CLI, config format, runtime, or tool behavior, inspect exact local versions first.
- Prefer version sources such as lockfiles, manifests, .mise.toml, .tool-versions, language/runtime files, Dockerfiles, and CI config.
- Use Context7 with the exact version when available; otherwise use official versioned docs, local CLI help/schema/source, or web-researcher for targeted docs checks.
- If the version cannot be determined or docs conflict, label the uncertainty and choose the smallest local validation step before coding.
"""

[features]
memories = true
multi_agent = true
codex_hooks = true

[memories]
generate_memories = true
use_memories = true

[history]
persistence = "save-all"
max_bytes = 20000000

[sandbox_workspace_write]
network_access = true
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
writable_roots = [
    "~/scripts/.git",
    "~/.cache/uv",
    "~/.codex/skills"
]

[tui]
theme = "gruvbox-dark"
alternate_screen = "never"
notifications = true
notification_condition = "unfocused"
notification_method = "auto"
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[projects."/home/mgajewskik/pai"]
trust_level = "trusted"

[projects."/home/mgajewskik/.codex"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/OpenMemory"]
trust_level = "trusted"

[projects."/home/mgajewskik/.config/opencode"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/opencode-openmemory"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/ralph"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/humem"]
trust_level = "trusted"

[projects."/home/mgajewskik/scripts"]
trust_level = "trusted"

[projects."/home/mgajewskik/test"]
trust_level = "trusted"

[projects."/home/mgajewskik/wp/dev/featurestore/fs-core"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/ansible"]
trust_level = "trusted"

[projects."/home/mgajewskik/.claude"]
trust_level = "trusted"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.codebase_memory_mcp]
command = "codebase-memory-mcp"
args = ["--ui=true", "--port=9749"]

[mcp_servers.codebase_memory_mcp.tools.list_projects]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_status]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_graph_schema]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_architecture]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_code]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_code_snippet]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_call_path]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.query_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.detect_changes]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_repository]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_path]
approval_mode = "approve"
