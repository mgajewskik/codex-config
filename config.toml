# https://developers.openai.com/codex/config-reference

model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
model_verbosity = "medium"
suppress_unstable_features_warning = true
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false
developer_instructions = """
Command execution:
- For every Bash or shell command tool call, start the command string with `rtk`.
- Use `rtk <command> ...` directly instead of relying on the RTK hook to deny bare commands and suggest a rewrite.
- Split independent shell probes into separate `rtk ...` commands instead of chaining bare command segments.
- If a shell command genuinely cannot be run through `rtk`, stop and explain why before running it.

Codebase discovery:
- Prefer `codebase_memory_mcp` over `rg` for broad discovery in indexed repos: architecture orientation, symbol or qualified-name discovery, graph-enriched code search, call/data-flow tracing, and snippet retrieval with structural metadata.
- Prefer `rg` or `rg --files` for exact path lookup, raw text, regex-heavy searches, docs, config, prose, unindexed repos, or when current filesystem state is the source of truth.
- When the active index is uncertain, start with `list_projects` or `index_status` and pass an explicit `project`.
- Use `search_graph` to resolve symbols before `get_code_snippet`; use `search_code` for grep-like code search with symbol-aware ranking; use `trace_path` for resolved call or data-flow questions.
- Treat MCP results as navigation and context, not proof. Verify criteria-relevant claims against current files with direct reads, `rg`, tests, or observed behavior.
- Do not use mutating MCP operations such as `index_repository`, `delete_project`, `manage_adr update`, or `ingest_traces` unless the task explicitly requires them.

Main-agent orchestration:
- Keep the parent agent responsible for task framing, criteria, integration, final validation choice, and the user-facing summary.
- Treat subagents as context-isolation tools as well as parallel workers.
- Delegate freely when delegation is available and a bounded task keeps the main context cleaner, reduces context load, provides an independent perspective, or can run without blocking the immediate next step.
- Do not delegate when local inspection is faster, the work cannot be bounded, or the next parent action depends on the delegated result.
- Use codebase-researcher for broad repo mapping, multi-module tracing, conventions, and impact-surface discovery.
- Use web-researcher for targeted external docs, current API behavior, version-sensitive facts, or concise source-backed recommendations.
- Use deep-web-researcher for broad external research, contested guidance, learning roadmaps, operational research, and comprehensive source-backed dossiers.
- Use implementer for bounded implementation slices after scope, criteria, and owned files are clear.
- Parallel implementers are allowed only when each has a disjoint write set and shared contracts are already decided.
- Run reviewer before final completion for MODERATE, COMPLEX/HIGH-IMPACT, global config, hook, security/safety, sandbox, auth, permission, policy, public API/schema, or multi-file behavior changes.
- Reviewer scope must cover the full affected implementation surface; run from a clean context by default so the review is independent and not polluted by the main agent's working context.
- Pass reviewer agents the goal, scope, criteria, anti-criteria, evidence, risks, and expected output.
- Do not complete with reviewer blockers open; fix and rerun, or explicitly report why a blocker is not actionable.
- If reviewer is skipped, the final answer must include `Reviewer: skipped` and the reason: TRIVIAL, SIMPLE-only, runtime policy blocked, or user explicitly declined.
- Treat memory and subagent output as context, not proof; verify important claims against current files, commands, tests, or source links.

Delegation packet discipline:
- Treat subagents as cleanly started bounded workers unless fork_context=true is explicitly justified.
- Before delegating, pass a compact packet with: goal, task type, scope boundaries, constraints and prohibitions, current evidence, criteria, anti-criteria, exact versions and docs evidence when relevant, owned files if editing, out-of-scope behavior, validation requirements, and expected output format.
- Do not pass raw conversation history, raw memory dumps, or broad context by default.
- Use fork_context=true only when the subagent genuinely needs the full conversation history; state the reason when doing so.
- Keep parent ownership of task framing, criteria quality, integration, and final validation.

Codex versioned-docs implementation:
- Before non-trivial implementation involving a library, framework, API, CLI, config format, runtime, or tool behavior, inspect exact local versions first.
- Prefer version sources such as lockfiles, manifests, .mise.toml, .tool-versions, language/runtime files, Dockerfiles, and CI config.
- Use Context7 with the exact version when available; otherwise use official versioned docs, local CLI help/schema/source, or web-researcher for targeted docs checks.
- If the version cannot be determined or docs conflict, label the uncertainty and choose the smallest local validation step before coding.
"""

[features]
memories = true
multi_agent = true
codex_hooks = true

[memories]
generate_memories = true
use_memories = true

[history]
persistence = "save-all"
max_bytes = 20000000

[sandbox_workspace_write]
network_access = true
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
writable_roots = [
    "~/scripts/.git",
    "~/.cache/uv",
    "~/.codex/skills"
]

[tui]
theme = "gruvbox-dark"
alternate_screen = "auto"
notifications = true
notification_condition = "unfocused"
notification_method = "auto"
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[projects."/home/mgajewskik/pai"]
trust_level = "trusted"

[projects."/home/mgajewskik/.codex"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/OpenMemory"]
trust_level = "trusted"

[projects."/home/mgajewskik/.config/opencode"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/opencode-openmemory"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/ralph"]
trust_level = "trusted"

[projects."/home/mgajewskik/dev/humem"]
trust_level = "trusted"

[projects."/home/mgajewskik/scripts"]
trust_level = "trusted"

[projects."/home/mgajewskik/test"]
trust_level = "trusted"

[projects."/home/mgajewskik/wp/dev/featurestore/fs-core"]
trust_level = "trusted"

[projects."/home/mgajewskik"]
trust_level = "trusted"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.codebase_memory_mcp]
command = "codebase-memory-mcp"
args = ["--ui=true", "--port=9749"]

[mcp_servers.codebase_memory_mcp.tools.list_projects]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_status]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_graph_schema]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_architecture]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.search_code]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.get_code_snippet]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_call_path]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.query_graph]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.detect_changes]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.index_repository]
approval_mode = "approve"

[mcp_servers.codebase_memory_mcp.tools.trace_path]
approval_mode = "approve"
