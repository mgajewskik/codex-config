# Unattended Codex loop profile, validated with codex-cli 0.160.0.
approval_policy = "never"
default_permissions = "loop"
web_search = "live"

[permissions.loop]
extends = ":workspace"

# Match the main config's tooling roots while retaining workspace protections.
# loop.sh separately grants Git writes only to its validated checkout.
[permissions.loop.workspace_roots]
"~/.cache" = true
"~/.codex/skills" = true
"~/.agents/skills" = true
"~/.codex/memories" = true
"~/.ansible" = true
"~/.local/state/mise" = true
"~/.local/share/uv" = true
"~/go/pkg" = true

[permissions.loop.filesystem.":workspace_roots"]
".git" = "read"
".codex" = "read"
".agents" = "read"
".aws" = "read"

[permissions.loop.network]
enabled = true
allow_local_binding = true

[permissions.loop.network.domains]
"*" = "allow"

# Disable unrelated unattended capabilities; intentional MCP exceptions follow.
[features]
apps = false
hooks = true
memories = false
multi_agent = false
plugins = false
remote_plugin = false

[features.multi_agent_v2]
enabled = true

[memories]
generate_memories = false
use_memories = false

[history]
persistence = "none"

# Allow fresh documentation lookup and indexed codebase search in loop runs.
[mcp_servers.codebase_memory_mcp]
enabled = true

[mcp_servers.context7]
enabled = true
